apply plugin: 'java'

tasks.named('compileJava', JavaCompile) {
	options.release = 8
}

tasks.named('compileTestJava', JavaCompile) {
	options.release = 8
}

def java21Target = 21
[
	configurations.compileClasspath,
	configurations.runtimeClasspath,
	configurations.testCompileClasspath,
	configurations.testRuntimeClasspath,
	configurations.apiElements,
	configurations.runtimeElements
].each { configuration ->
	configuration.attributes.attribute(
			org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE,
			java21Target
	)
}

configurations.configureEach {
	exclude group: 'com.sun.xml.bind', module: 'jaxb-osgi'
}

apply plugin: 'io.spring.dependency-management'
dependencyManagement {
	imports {
		mavenBom 'org.springframework.boot:spring-boot-dependencies:2.3.12.RELEASE'
	}
}

dependencies {

	api project(':crnk-setup:crnk-setup-servlet')
	api project(':crnk-setup:crnk-setup-spring')
	compileOnly project(':crnk-data:crnk-data-jpa')
	compileOnly project(':crnk-validation')
	compileOnly project(':crnk-home')
	compileOnly project(':crnk-meta')
	compileOnly project(':crnk-operations')
	compileOnly project(':crnk-security')
	compileOnly project(':crnk-ui')
	compileOnly project(':crnk-client')
	compileOnly project(':crnk-data:crnk-data-facet')
	compileOnly project(':crnk-format:crnk-format-plain-json')
	compileOnly project(':crnk-monitor:crnk-monitor-opentracing')

	compileOnly 'io.opentracing:opentracing-api:0.31.0'

	compileOnly 'org.hibernate.javax.persistence:hibernate-jpa-2.1-api:1.0.0.Final'
	compileOnly 'org.springframework.boot:spring-boot-starter-web'
	compileOnly 'org.springframework.boot:spring-boot-configuration-processor'
	compileOnly 'org.springframework.boot:spring-boot-starter-actuator'
    compileOnly 'org.springframework.boot:spring-boot-starter-validation'
	compileOnly 'org.springframework.security:spring-security-core'

	compileOnly 'org.springframework:spring-orm'

	testImplementation project(':crnk-data:crnk-data-jpa')
	testImplementation project(':crnk-validation')
	testImplementation project(':crnk-home')
	testImplementation project(':crnk-meta')
	testImplementation project(':crnk-operations')
	testImplementation project(':crnk-security')
	testImplementation project(':crnk-ui')
	testImplementation project(':crnk-client')
	testImplementation project(':crnk-test')
	testImplementation project(':crnk-data:crnk-data-facet')
	testImplementation project(':crnk-format:crnk-format-plain-json')
	testImplementation 'io.rest-assured:rest-assured:5.4.0'
	testImplementation 'io.rest-assured:json-path:5.4.0'
	testImplementation 'io.rest-assured:xml-path:5.4.0'
	testImplementation 'io.rest-assured:rest-assured-common:5.4.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	testImplementation 'org.springframework.boot:spring-boot-starter-web'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation'

	testImplementation 'org.hibernate:hibernate-core'
	testImplementation 'org.hibernate:hibernate-entitymanager'
	testImplementation 'com.h2database:h2'

	testImplementation 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework:spring-orm'
	testImplementation 'org.springframework.security:spring-security-core'
	testImplementation 'net.javacrumbs.json-unit:json-unit-fluent:1.5.3'
	testImplementation 'org.mockito:mockito-core:5.12.0'
	testImplementation 'net.bytebuddy:byte-buddy:1.14.15'
	testImplementation 'net.bytebuddy:byte-buddy-agent:1.14.15'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.6.3'
	testImplementation 'pl.pragmatists:JUnitParams:1.1.1'
}
