GROUP_ID=ixshel
org.gradle.configureondemand=true
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Maven Central publishing is configured in build.gradle via the Vanniktech plugin.
# Keep credentials and signing material out of VCS by providing them through
# ~/.gradle/gradle.properties or CI environment variables:
#   mavenCentralPublishing=true
#   ORG_GRADLE_PROJECT_mavenCentralUsername=...
#   ORG_GRADLE_PROJECT_mavenCentralPassword=...
#   ORG_GRADLE_PROJECT_signingInMemoryKey=...
#   ORG_GRADLE_PROJECT_signingInMemoryKeyId=...         # optional
#   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=...   # optional
mavenCentralPublishing=true

BUILD_VERSION_PREFIX=3.4

systemProp.sonar.host.url=https://sonarqube.com
systemProp.sonar.organization=crnk

systemProp.org.ajoberstar.grgit.auth.force=HARDCODED

JUNIT_VERSION=5.3.1
