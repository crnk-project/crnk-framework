apply plugin: 'java'

sourceSets {
	test {
		java.srcDirs = []
		resources.srcDirs = []
	}
}

dependencies {
	api project(':crnk-core')
	api project(':crnk-meta')
	compileOnly project(':crnk-client')
	compileOnly project(':crnk-data:crnk-data-facet')
	compileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	compileOnly 'jakarta.transaction:jakarta.transaction-api:2.0.1'
	compileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'
	compileOnly group: 'com.querydsl', name: 'querydsl-jpa', version: '5.1.0', classifier: 'jakarta'
	compileOnly 'org.jetbrains:annotations:24.1.0'
	compileOnly 'com.google.guava:guava:33.1.0-jre'

	testCompileOnly 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	testCompileOnly 'jakarta.annotation:jakarta.annotation-api:2.1.1'
	testCompileOnly 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	testAnnotationProcessor(
			'com.querydsl:querydsl-apt:5.1.0:jakarta',
			'jakarta.persistence:jakarta.persistence-api:3.1.0',
			'jakarta.annotation:jakarta.annotation-api:2.1.1',
	)

	// necessary for intellij having a broken annotation processing support
	compileOnly 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor(
			'com.querydsl:querydsl-apt:5.1.0:jakarta',
			'jakarta.persistence:jakarta.persistence-api:3.1.0',
			'jakarta.annotation:jakarta.annotation-api:2.1.1',
	)

	compileOnly group: 'org.hibernate.orm', name: 'hibernate-core', version: '6.4.4.Final'

	testImplementation project(':crnk-client')
	testImplementation project(':crnk-setup:crnk-setup-rs')
	testImplementation project(':crnk-test')
	testImplementation project(':crnk-client')
	testImplementation project(':crnk-data:crnk-data-facet')
	testImplementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
	testImplementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'
	testImplementation group: 'org.hibernate.orm', name: 'hibernate-core', version: '6.4.4.Final'
	testImplementation 'com.google.guava:guava:33.1.0-jre'
	testImplementation group: 'org.springframework', name: 'spring-orm', version: '5.3.39'
	testImplementation group: 'org.springframework', name: 'spring-context', version: '5.3.39'
	testImplementation group: 'org.springframework', name: 'spring-test', version: '5.3.39'
	testImplementation group: 'com.h2database', name: 'h2', version: '1.4.187'
	testImplementation(group: 'com.querydsl', name: 'querydsl-apt', version: '5.1.0', classifier: 'jakarta')
	testImplementation(group: 'com.querydsl', name: 'querydsl-jpa', version: '5.1.0', classifier: 'jakarta')
}
