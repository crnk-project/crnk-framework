apply plugin: 'java'

dependencies {
	api project(':crnk-core')
	compileOnly project(':crnk-meta')
	compileOnly project(':crnk-client')
	compileOnly 'javax.validation:validation-api:2.0.1.Final'

	testImplementation project(':crnk-client')
	testImplementation project(':crnk-setup:crnk-setup-rs')
	testImplementation project(':crnk-test')
	testImplementation project(':crnk-meta')
	testImplementation 'javax.validation:validation-api:2.0.1.Final'
	testImplementation group: 'org.hibernate', name: 'hibernate-validator', version: '6.2.5.Final'
	testImplementation 'org.glassfish:javax.el:3.0.1-b12'
	testImplementation group: 'org.springframework', name: 'spring-orm', version: '5.3.39'
	testImplementation group: 'org.springframework', name: 'spring-context', version: '5.3.39'
	testImplementation group: 'org.springframework', name: 'spring-test', version: '5.3.39'
	testImplementation(group: 'javax', name: 'javaee-api', version: '7.0')
}
