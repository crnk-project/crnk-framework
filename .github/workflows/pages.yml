name: Publish GitHub Pages

on:
  push:
    tags: [ '3.4.*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example, 3.4.20261103000000)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          submodules: true
      - uses: actions/checkout@v4
        with:
          repository: crnk-project/crnk-web
          ref: master
          path: crnk-web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/configure-pages@v5
      - run: chmod +x gradlew
      - run: ./gradlew :crnk-documentation:preparePages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: crnk-documentation/build/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
