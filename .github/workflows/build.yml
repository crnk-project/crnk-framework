name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ubuntu Temurin Java 17
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set Gradle Wrapper Permissions
      run: chmod +x gradlew
    - name: Build
      run: ./gradlew assemble -x :crnk-integration-examples:dagger-vertx-example:startScripts -x :crnk-integration-examples:dagger-vertx-example:distTar -x :crnk-integration-examples:dagger-vertx-example:distZip
