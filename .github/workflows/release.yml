name: Publish JAR release

on:
  push:
    tags: [ '3.4.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew
      - run: ./gradlew assemble -PmavenCentralUsername=release -x :crnk-integration-examples:dagger-vertx-example:startScripts -x :crnk-integration-examples:dagger-vertx-example:distTar -x :crnk-integration-examples:dagger-vertx-example:distZip
      - name: Publish JARs to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: '**/build/libs/*.jar'
