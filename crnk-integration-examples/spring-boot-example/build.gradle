apply plugin: 'java'

apply plugin: 'application'

mainClassName = "io.crnk.example.springboot.SpringBootExampleApplication"

dependencies {

    api project(':crnk-setup:crnk-setup-spring-boot2')
    api project(':crnk-data:crnk-data-jpa')
    api project(':crnk-validation')
    api project(':crnk-home')
    api project(':crnk-ui')
    api project(':crnk-operations')
    api project(':crnk-security')
    api project(':crnk-data:crnk-data-facet')

    // necessary for intellij having a broken annotation processing support
    compileOnly project(':crnk-gen:crnk-gen-java')
    annotationProcessor project(':crnk-gen:crnk-gen-java')

    testImplementation "org.junit.jupiter:junit-jupiter-api:$JUNIT_VERSION"
    testImplementation "org.junit.jupiter:junit-jupiter-params:$JUNIT_VERSION"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:$JUNIT_VERSION"
    testImplementation "org.junit.vintage:junit-vintage-engine:$JUNIT_VERSION"

    api 'org.springframework.boot:spring-boot-starter-data-jpa:2.0.1.RELEASE'
    api 'org.springframework.boot:spring-boot-starter-web:2.0.1.RELEASE'
    api 'org.springframework.boot:spring-boot-starter-actuator:2.0.1.RELEASE'

    api 'org.hibernate:hibernate-core:5.1.0.Final'
    api 'org.hibernate:hibernate-entitymanager:5.1.0.Final'
    api 'com.h2database:h2:1.4.195'
    api 'com.squareup.okhttp3:okhttp:3.4.1'
    api 'com.google.guava:guava:18.0'

    testImplementation project(':crnk-client')
    testImplementation 'com.jayway.restassured:rest-assured:2.9.0'
    testImplementation 'com.jayway.restassured:json-schema-validator:2.9.0'
    testImplementation 'commons-io:commons-io:1.3.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:2.0.1.RELEASE'

}
