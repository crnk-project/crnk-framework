apply plugin: 'war'

war {
	archiveFileName.set("example.war")
}

dependencies {

	api project(':crnk-setup:crnk-setup-rs')
	api project(':crnk-setup:crnk-setup-cdi')
	api project(':crnk-home')
	api project(':crnk-data:crnk-data-jpa')

	compileOnly 'javax:javaee-api:7.0'

}

tasks.named('compileJava') {
	dependsOn ':crnk-setup:crnk-setup-cdi:processResources'
}
