apply plugin: 'java'

apply plugin: 'application'

mainClassName = "io.crnk.example.jersey.App"

dependencies {
	api project(':crnk-setup:crnk-setup-rs')
	api project(':crnk-home')

	api 'ch.qos.logback:logback-classic:1.2.3'

	api 'javax.ws.rs:javax.ws.rs-api:2.1'
	api 'javax.servlet:javax.servlet-api:3.0.1'

	api 'com.fasterxml.jackson.jaxrs:jackson-jaxrs-json-provider'
	api 'com.fasterxml.jackson.jaxrs:jackson-jaxrs-base'
	api 'com.fasterxml.jackson.core:jackson-core'
	api 'org.glassfish.jersey.containers:jersey-container-servlet'
	api 'org.glassfish.jersey.core:jersey-server'
	api 'org.glassfish.jersey.containers:jersey-container-grizzly2-http'
	api 'org.glassfish.jersey.inject:jersey-hk2'

	api('org.glassfish.jersey.media:jersey-media-json-jackson') {
		exclude(module: 'jackson-jaxrs-base')
		exclude(module: 'jackson-jaxrs-json-provider')
		exclude(module: 'jackson-annotations')
	}

	api 'com.google.guava:guava:18.0'
	testImplementation "org.junit.jupiter:junit-jupiter-api:$JUNIT_VERSION"
	testImplementation "org.junit.jupiter:junit-jupiter-params:$JUNIT_VERSION"
	testImplementation "org.junit.jupiter:junit-jupiter-engine:$JUNIT_VERSION"
	testImplementation "org.junit.vintage:junit-vintage-engine:$JUNIT_VERSION"
	testImplementation 'org.hamcrest:hamcrest-library:1.3'
	testImplementation 'org.glassfish.jersey.test-framework.providers:jersey-test-framework-provider-inmemory'
}
